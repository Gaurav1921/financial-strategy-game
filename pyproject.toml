[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear: likely bugs and design problems
    "S",   # flake8-bandit: security issues
    "C90", # mccabe: cyclomatic complexity
    "N",   # pep8-naming
    "D",   # pydocstyle: docstring conventions
    "UP",  # pyupgrade: modern Python syntax
    "SIM", # flake8-simplify
    "I",   # isort: import ordering
]
ignore = [
    "D203", # conflicts with D211 (blank line before class docstring)
    "D213", # conflicts with D212 (multi-line summary on first line)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"sim/*.py" = [
    "S311", # RNG use here is simulation randomness, not a security context
]
# simulate_game's round loop (human_sim.py) and resolve_jvs_human/
# resolve_power_card_claims/_resolve_power_card_action orchestrate many
# feature-flagged steps in sequence; simulate_season (jv_simulation.py) is
# the same shape. Splitting them is real, valuable work, but it's the exact
# kind of refactor deferred this pass (see BALANCE_TESTING.md's own
# "duplication/simplification" backlog): touching already-validated
# simulation logic without time to re-verify every cited number is a worse
# trade than a scoped, documented exception. Tracked, not silently ignored.
"sim/human_sim.py" = ["C901"]
"sim/jv_simulation.py" = ["C901"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
